# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        run: ./mvnw -B verify

        

  inspect-openclassrooms:
    runs-on: ubuntu-latest

    container:
      image: laurentgrangeau/oc-devops:23.37

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Examiner les outils disponibles
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Maven ==="
          mvn -version
          echo "=== Fichiers ==="
          ls -la
